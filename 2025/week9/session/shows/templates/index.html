        // Dynamically generating html client side
        let input = document.querySelector('input');            // targets the input
        input.addEventListener('input', async function() {      // listents for human input
            let response = await fetch('/search?q=' + input.value);     // makes http request from javascript to server asking for that value query
            let shows = await response.json();                  // wait to get response from the server
            let html = '';
            for (let show of shows) {
                html += '<li>' + show.title + '</li>';
            }
            document.querySelector('ul').innerHTML = html;
        })
    </script>
