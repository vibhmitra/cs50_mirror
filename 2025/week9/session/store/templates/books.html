{% extends "layout.html" %}

{% block body %}
    <h1>Books</h1>
    <sub><a href="/cart">Show Cart</a></sub>
    {% for book in books %}
        <h4>id = {{ book.id }},  title= {{ book.title }}</h4>
        <form action="/cart" method="post">
            <input type="hidden" name="id" value="{{ book.id }}">
            <button type="submit">Add to Cart</button>
        </form>
    {% endfor%}
    <sub><a href="/logout">Clear Cart</a></sub>
{% endblock %}
