<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register!</title>
</head>
<body>
    <form>
        <!-- client side validation for pattern : DOWN SIDE for this is editable at users side -->
        <input autocomplete="off" autofocus name="email" placeholder="Email" pattern=".+@.+\.edu">
        <input autocomplete="off" name="phone" placeholder="phone" pattern="/d{10}">
        <button>Register</button>
    </form>
</body>
</html>
