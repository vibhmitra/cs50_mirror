<!DOCTYPE html>
<html lang="en">
    <head>
        <script>
            function greet() {
                let name = document.querySelector('#name').value;
                alert('hello,' + name + '!')
            }
        </script>
        <title>
            hello, dynamic!
        </title>
    </head>
    <body>
        <form onsubmit="greet(); return false;">
            <input autocomplete="off" id="name" name="name" placeholder="Name" type="text">
            <input type="Submit">
        </form>
    </body>
</html>
