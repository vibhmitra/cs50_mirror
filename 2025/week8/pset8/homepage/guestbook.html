<!DOCTYPE html>

<html lang="en">

    <head>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
        <link href="styles.css" rel="stylesheet">
        <script>
            const box = id => document.getElementById(id);

            function signit() {
                let name = box('InputName').value.trim();
                let msg = box('nicemessage').value.trim();
                if (!name || !msg) return alert('enter both pls!');

                // current time
                let time = new Date().toLocaleString();

                // add card to page only
                box('messageCards').insertAdjacentHTML('beforeend', `
                    <div class="card mt-3 shadow-sm">
                        <div class="card-body">
                        <h5>${name}</h5>
                        <p><em>${msg}</em></p>
                        <small class="text-muted">🕒 ${time}</small>
                        </div>
                    </div>
                `);

                // clear inputs
                // box('InputName').value = box('nicemessage').value = '';
            }
        </script>


        <title>My Simple Homepage 🛖</title>
    </head>

    <body>
        <div class="container w-50 p-3 border">

            <!-- Navigation Elements -->
            <div class="container mt-3">
                <h2>My Simple Homepage 🛖</h2>
                <p>my place where i share day-to-day stuff!</p>
                <nav class="navbar navbar-expand-sm bg-dark navbar-dark">
                    <ul class="navbar-nav">
                        <li class="nav-item">
                            <a class="nav-link" href="/index.html">Home</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="/aboutme.html">About Me</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link active" href="/guestbook.html">Guestbook</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="/contact.html">Contact Me!</a>
                        </li>
                    </ul>
                </nav>
            </div>


            <!-- Middle Section -->
            <div class="container mt-2">
                <h4>Sign my guestbook!</h4>
                <form onsubmit="signit(); return false;">
                    <div class="mb-1">
                        <label for="InputName" class="form-label">Your name </label>
                        <input type="text" class="form-control" id="InputName" placeholder="enter your name...">
                    </div>
                    <div class="mb-1">
                        <label for="nicemessage" class="form-label">Enter a nice message!</label>
                        <!-- <input type="textbox" class="form-control" id="nicemessage" placeholder="I love it! 😍"> -->
                        <textarea class="form-control" id="nicemessage" placeholder="I love it! 😍" rows="3"></textarea>
                    </div>
                    <button type="submit" class="btn btn-light border">sign it! ✒️</button>
                </form>

                <div id="messageCards"></div>


                <!-- Footer Section -->
                <footer class="mt-5 p-4 bg-warning text-center">
                    <div class="mt-5">&copy; 2025 my nice looking homepage! 🌞</div>
                </footer>

            </div>
        </div>
    </body>

</html>
